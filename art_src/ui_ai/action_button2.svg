<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 184" width="100%" height="100%">
  <!-- 小动作按钮底稿（购买 / 装备 / 使用 / 加点），最终在游戏里显示约 150x46。
       思路：明亮的奶油白 + 金线，外圈用「暖金棕」而不是黑色描边 ——
       之前那版近黑的粗边被读成"廉价塑料感"。 -->
  <defs>
    <linearGradient id="ab_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="0.42" stop-color="#fdf4de"/>
      <stop offset="1" stop-color="#f2e2bb"/>
    </linearGradient>
    <linearGradient id="ab_ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c574"/>
      <stop offset="1" stop-color="#bb8c2c"/>
    </linearGradient>
  </defs>
  <rect x="6" y="10" width="588" height="168" rx="36" fill="url(#ab_ring)"/>
  <rect x="16" y="20" width="568" height="148" rx="28" fill="url(#ab_body)"/>
  <rect x="30" y="34" width="540" height="120" rx="20" fill="none"
        stroke="#d9b061" stroke-width="3"/>
  <!-- 顶部高光：做出"微微凸起"的立体感 -->
  <path d="M64 52 Q 300 34 536 52" stroke="#ffffff" stroke-width="9"
        fill="none" opacity="0.7" stroke-linecap="round"/>
  <!-- 底部暖色内阴影 -->
  <path d="M70 146 Q 300 160 530 146" stroke="#c9a45c" stroke-width="7"
        fill="none" opacity="0.45" stroke-linecap="round"/>
  <!-- 左右小卷草花饰 -->
  <g fill="none" stroke="#c9a45c" stroke-width="4" opacity="0.9">
    <path d="M40 92 q 14 -18 30 0 q -14 18 -30 0 z"/>
    <path d="M560 92 q -14 -18 -30 0 q 14 18 30 0 z"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <!-- 背包格 / 装备格底稿，最终显示约 64-96 见方。
       中间是「凹进去」的浅米色槽 —— 亮色 UI 里也能让图标压在暗一档的底上。 -->
  <defs>
    <linearGradient id="sl_ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7c87c"/>
      <stop offset="1" stop-color="#b98a2c"/>
    </linearGradient>
    <linearGradient id="sl_in" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe4cd"/>
      <stop offset="0.35" stop-color="#fdf7ea"/>
      <stop offset="1" stop-color="#f4ecda"/>
    </linearGradient>
  </defs>
  <rect x="4" y="6" width="312" height="308" rx="40" fill="url(#sl_ring)"/>
  <rect x="14" y="16" width="292" height="288" rx="32" fill="#fffaf0"/>
  <rect x="26" y="28" width="268" height="264" rx="24" fill="none"
        stroke="#d9b061" stroke-width="4"/>
  <rect x="38" y="40" width="244" height="240" rx="18" fill="url(#sl_in)"/>
  <!-- 凹槽上沿的阴影：整格看起来是"挖"出来的 -->
  <rect x="38" y="40" width="244" height="34" rx="14" fill="#c6ad78" opacity="0.42"/>
  <!-- 四角小三角花角 -->
  <g fill="#c9a45c" opacity="0.85">
    <path d="M32 40 l 18 0 l -18 18 z"/>
    <path d="M288 40 l -18 0 l 18 18 z"/>
    <path d="M32 280 l 18 0 l -18 -18 z"/>
    <path d="M288 280 l -18 0 l 18 -18 z"/>
  </g>
</svg>

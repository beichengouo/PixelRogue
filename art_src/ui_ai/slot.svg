<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <!-- 背包/装备格子底稿：外框 + 内凹槽，最终显示约 96x96 -->
  <rect x="0" y="0" width="320" height="320" rx="34" fill="#1b120a"/>
  <rect x="12" y="12" width="296" height="296" rx="28" fill="#c8951a"/>
  <rect x="26" y="26" width="268" height="268" rx="22" fill="#7a5a12"/>
  <!-- 中间的凹槽：比边框暗，做出"能放东西"的凹陷感 -->
  <rect x="42" y="42" width="236" height="236" rx="18" fill="#3a2a12"/>
  <rect x="52" y="52" width="216" height="216" rx="14" fill="#2a1d0c"/>
  <rect x="56" y="56" width="208" height="26" rx="10" fill="#100a05" opacity="0.55"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 168" width="100%" height="100%">
  <!-- 花饰版菜单按钮底稿。
       ControlNet Tile 是「照着结构画」，所以底稿里的线条越丰富，
       AI 就越有东西可以发挥成鎏金浮雕。这里塞了三类结构：
         1. 多层框线（外描边 / 金带 / 内衬 / 细内线）→ AI 会画成多层金属边
         2. 四角花柱（同心圆 + 花瓣）→ AI 会画成卷草纹 / 花角
         3. 中央的菱形暗纹带 → AI 会画成雕刻底纹
  -->
  <rect x="0" y="0" width="1024" height="168" rx="30" fill="#1a1209"/>
  <rect x="10" y="10" width="1004" height="148" rx="24" fill="#c8951a"/>
  <rect x="22" y="22" width="980" height="124" rx="18" fill="#8a6414"/>
  <rect x="30" y="30" width="964" height="108" rx="14" fill="#f0d08a"/>
  <rect x="40" y="40" width="944" height="88" rx="10" fill="#e0bb66"/>
  <rect x="48" y="48" width="928" height="72" rx="8" fill="#eccd80"/>

  <!-- 中央菱形暗纹带：一排小菱形，AI 会把它当"雕刻底纹"来画 -->
  <g fill="#c9a349">
    <rect x="300" y="76" width="18" height="18" transform="rotate(45 309 85)"/>
    <rect x="352" y="76" width="18" height="18" transform="rotate(45 361 85)"/>
    <rect x="404" y="76" width="18" height="18" transform="rotate(45 413 85)"/>
    <rect x="456" y="76" width="18" height="18" transform="rotate(45 465 85)"/>
    <rect x="508" y="76" width="18" height="18" transform="rotate(45 517 85)"/>
    <rect x="560" y="76" width="18" height="18" transform="rotate(45 569 85)"/>
    <rect x="612" y="76" width="18" height="18" transform="rotate(45 621 85)"/>
    <rect x="664" y="76" width="18" height="18" transform="rotate(45 673 85)"/>
    <rect x="716" y="76" width="18" height="18" transform="rotate(45 725 85)"/>
  </g>

  <!-- 四角花柱：同心圆 + 四片花瓣 -->
  <g>
    <circle cx="72" cy="84" r="30" fill="#f7e2a6"/>
    <circle cx="72" cy="84" r="20" fill="#c8951a"/>
    <circle cx="72" cy="84" r="10" fill="#fff3cc"/>
    <circle cx="952" cy="84" r="30" fill="#f7e2a6"/>
    <circle cx="952" cy="84" r="20" fill="#c8951a"/>
    <circle cx="952" cy="84" r="10" fill="#fff3cc"/>
  </g>
  <g fill="#e8c46a">
    <path d="M72 40 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
    <path d="M72 128 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
    <path d="M952 40 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
    <path d="M952 128 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
  </g>

  <!-- 两侧的竖向凹槽花纹 -->
  <g fill="#c9a349">
    <rect x="120" y="56" width="6" height="56" rx="3"/>
    <rect x="132" y="62" width="4" height="44" rx="2"/>
    <rect x="888" y="56" width="6" height="56" rx="3"/>
    <rect x="898" y="62" width="4" height="44" rx="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" width="100%" height="100%">
  <!-- 小面板底稿（背包右侧详情栏这类 300x400 的竖长条）。
       和大面板的区别：边框更细、角花更小 —— 大图的粗角花铺到小面板上会
       把中间挤得只剩一条缝（实测被读成"边框不完整/被切掉"）。 -->
  <defs>
    <linearGradient id="sp_ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8cf93"/>
      <stop offset="1" stop-color="#c19a3c"/>
    </linearGradient>
    <linearGradient id="sp_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.5" stop-color="#fdf6e6"/>
      <stop offset="1" stop-color="#f7efdb"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="756" height="1012" rx="26" fill="url(#sp_ring)"/>
  <rect x="18" y="18" width="732" height="988" rx="18" fill="url(#sp_body)"/>
  <rect x="30" y="30" width="708" height="964" rx="14" fill="none"
        stroke="#dcb768" stroke-width="3"/>
  <!-- 顶部标题带 -->
  <path d="M30 58 q 0 -28 28 -28 h 652 q 28 0 28 28 v 22 h -708 z" fill="#f7ebcd"/>
  <path d="M30 80 h 708" stroke="#dcb768" stroke-width="3"/>
  <!-- 四个小角饰（不是大卷草，只占 40 像素左右） -->
  <g fill="none" stroke="#c9a45c" stroke-width="4">
    <path d="M38 70 q -8 -22 14 -30 q 14 2 10 14"/>
    <path d="M730 70 q 8 -22 -14 -30 q -14 2 -10 14"/>
    <path d="M38 982 q -8 22 14 30 q 14 -2 10 -14"/>
    <path d="M730 982 q 8 22 -14 30 q -14 -2 -10 -14"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 700" width="100%" height="100%">
  <!-- 背包/商店大面板底稿（会被拿去九宫格切图），最终显示约 840x600 -->
  <rect x="0" y="0" width="1024" height="700" rx="34" fill="#1b120a"/>
  <rect x="12" y="12" width="1000" height="676" rx="28" fill="#d8ae4a"/>
  <rect x="26" y="26" width="972" height="648" rx="22" fill="#8a6414"/>
  <rect x="36" y="36" width="952" height="628" rx="18" fill="#f2dfae"/>
  <!-- 顶部一条深色标题带：让模型把标题区做成另一层材质 -->
  <rect x="36" y="36" width="952" height="96" rx="18" fill="#d8bf88"/>
  <!-- 四角的花角位置提示 -->
  <circle cx="74" cy="74" r="16" fill="#fff3cc"/>
  <circle cx="950" cy="74" r="16" fill="#fff3cc"/>
  <circle cx="74" cy="626" r="16" fill="#fff3cc"/>
  <circle cx="950" cy="626" r="16" fill="#fff3cc"/>

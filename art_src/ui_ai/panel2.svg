<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 350" width="100%" height="100%">
  <!-- 大面板底稿（背包 / 商店 / 天赋树 / 结算），最终九宫格铺到约 840x600。
       出图时按 512x350 重绘，再分块放大到 1024x700，所以这里是半尺寸。 -->
  <defs>
    <linearGradient id="pn_ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eed79b"/>
      <stop offset="0.5" stop-color="#d5ac5a"/>
      <stop offset="1" stop-color="#b3852c"/>
    </linearGradient>
    <linearGradient id="pn_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.5" stop-color="#fdf7e9"/>
      <stop offset="1" stop-color="#f7efdc"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="504" height="342" rx="26" fill="url(#pn_ring)"/>
  <rect x="13" y="13" width="486" height="324" rx="20" fill="url(#pn_body)"/>
  <rect x="22" y="22" width="468" height="306" rx="16" fill="none"
        stroke="#dcb768" stroke-width="3"/>
  <!-- 顶部标题带：和内容区做出材质差，让标题区一眼分开 -->
  <path d="M22 46 q 0 -24 24 -24 h 420 q 24 0 24 24 v 26 h -468 z" fill="#f6e9c9"/>
  <path d="M22 72 h 468" stroke="#dcb768" stroke-width="3"/>
  <!-- 四角卷草花角 -->
  <g fill="none" stroke="#c9a45c" stroke-width="3">
    <path d="M30 62 q -10 -30 22 -38 q 16 6 10 18 q -8 10 -18 2"/>
    <path d="M482 62 q 10 -30 -22 -38 q -16 6 -10 18 q 8 10 18 2"/>
    <path d="M30 288 q -10 30 22 38 q 16 -6 10 -18 q -8 -10 -18 -2"/>
    <path d="M482 288 q 10 30 -22 38 q -16 -6 -10 -18 q 8 -10 18 -2"/>
  </g>
</svg>
